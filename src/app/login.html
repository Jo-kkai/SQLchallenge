<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Extremely Secure Site</title>
  </head>
  <body>
    <main>
      <h1>Login Page</h1>
      <p>please enter your credentials</p>
      <form id="login-form" method="post" action="back.php">
        <label for="username">username : </label>
        <input type="text" id="username" name="username" placeholder="john" />
        <br />
        <label for="password">password : </label>
        <input type="text" id="password" name="password" placeholder="..." />
        <br />
        <button type="submit">Continue</button>
        <p id="error" style="display: none">invalid credentials!</p>
      </form>
      <a href="/">&larr; home</a>
    </main>
    <script>
      const form = document.getElementById("login-form");
      const error = document.getElementById("error");

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        error.style.display = "none";

        const res = await fetch("back.php", {
          method: "POST",
          body: new URLSearchParams(new FormData(form)),
        });

        const text = await res.text();
        try {
          const data = JSON.parse(text);
          if (data.success === false) {
            error.style.display = "block";
            return;
          }
        } catch (_) {
          document.open();
          document.write(text);
          document.close();
        }
      });
    </script>
  </body>
</html>
